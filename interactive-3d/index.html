ght').classList.add('on');document.getElementById('day').classList.remove('on')}day();document.getElementById('day').onclick=day;document.getElementById('night').onclick=night;document.getElementById('fs').onclick=async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()};const HS=[[document.getElementById('h1'),new THREE.Vector3(-1.2,1.45,1.25)],[document.getElementById('h2'),new THREE.Vector3(3.55,1.45,-1.55)],[document.getElementById('h3'),new THREE.Vector3(-2.25,2,-4)]];function hs(){for(const[e,q]of HS){let p=q.clone().project(C),v=p.z<1&&p.z>-1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1;e.style.opacity=v?1:0;e.style.left=(p.x*.5+.5)*innerWidth+'px';e.style.top=(-p.y*.5+.5)*innerHeight+'px'}}function loop(){requestAnimationFrame(loop);O.update();if(T){let u=Math.min(1,(performance.now()-T.s)/900),e=1-(1-u)**3;C.position.lerpVectors(T.fp,T.tp,e);O.target.lerpVectors(T.ft,T.tt,e);if(u>=1)T=null}hs();R.render(S,C)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)})</script></body></html>
