<style>

<body>

<div class="ui">
  <div class="top">
    <div class="panel title"><div class="eyebrow">TP-LINK WF · INTERACTIVE WEB 3D</div><h1>TP-Link WF 互動式 3D 攤位</h1><p>可直接拖曳旋轉、縮放與切換視角。依提案內容重建：上方 Logo 燈箱、左側電競體驗、中央投票展示台、右側 QR Code / Wi-Fi 科技牆。</p></div>

<script type="module">
const loading=document.getElementById('loading'),error=document.getElementById('error');
try{
  const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/+esm');
  const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js/+esm');
  const app=document.getElementById('app');
  const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;app.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color(0x061018);scene.fog=new THREE.Fog(0x061018,28,55);
  const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,150);camera.position.set(13,8,13);
  const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,2.6,0);controls.minDistance=6;controls.maxDistance=28;controls.maxPolarAngle=Math.PI*.49;controls.autoRotate=true;controls.autoRotateSpeed=.8;
  const teal=0x20dcef,cyan=0x8df7ff;

  function box(w,h,d,m,x=0,y=0,z=0){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=q.receiveShadow=true;scene.add(q);return q}
  function text(lines,opt={}){const c=document.createElement('canvas');c.width=opt.w||900;c.height=opt.h||420;const g=c.getContext('2d');if(opt.bg){g.fillStyle=opt.bg;g.fillRect(0,0,c.width,c.height)}g.fillStyle=opt.color||'#fff';g.textAlign=opt.align||'center';const a=Array.isArray(lines)?lines:[lines];a.forEach((s,i)=>{g.font=`700 ${(opt.sizes&&opt.sizes[i])||opt.size||64}px Arial, Microsoft JhengHei`;g.fillText(s,opt.align==='left'?55:c.width/2,(opt.y||110)+i*(opt.step||82))});const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;return tx}

  function frame(w,h,x,y,z){const m=mat(0xffffff,{e:teal,ei:2,r:.2});[[w,.07,.07,0,h/2,0],[w,.07,.07,0,-h/2,0],[.07,h,.07,-w/2,0,0],[.07,h,.07,w/2,0,0]].forEach(v=>{const b=new THREE.Mesh(new THREE.BoxGeometry(v[0],v[1],v[2]),m);b.position.set(v[3],v[4],v[5]);b.castShadow=true;scene.add(b)})}
  function router(x,y,z,s=.5,color=0x11171b){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(1.25*s,.2*s,.8*s),mat(color,{m:.45,r:.4}));g.add(b);for(let i=0;i<4;i++){const a=new THREE.Mesh(new THREE.CylinderGeometry(.025*s,.03*s,.7*s,8),mat(0x1b2328,{m:.5,r:.4}));a.position.set((i-1.5)*.22*s,.4*s,-.15*s);g.add(a)}const led=new THREE.Mesh(new THREE.BoxGeometry(.7*s,.03*s,.05*s),mat(0xffffff,{e:teal,ei:1.5,r:.2}));led.position.set(0,.06*s,.33*s);g.add(led);g.position.set(x,y,z);scene.add(g);return g}
  scene.add(new THREE.AmbientLight(0xbfefff,.75));const hemi=new THREE.HemisphereLight(0xc7fbff,0x142733,.8);scene.add(hemi);const spot=new THREE.SpotLight(0xffffff,170,65,Math.PI/5,.35,1.2);spot.position.set(0,16,4);spot.target.position.set(0,2.4,0);spot.castShadow=true;scene.add(spot,spot.target);const fill=new THREE.SpotLight(0x74efff,70,60,Math.PI/5,.5,1.4);fill.position.set(-10,11,7);fill.target.position.set(-2,2,0);scene.add(fill,fill.target);

  box(12,.18,8,mat(0xf1f7fa,{r:.72,m:.12}),0,.09,0);box(12.3,.04,8.3,mat(0xffffff,{e:teal,ei:1.5,r:.2}),0,.13,0);
  box(.25,4.7,5.2,mat(0x111a21,{r:.55}),-5.8,2.35,.1);box(5.5,4.7,.25,mat(0x111a21,{r:.55}),-3,2.35,-2.45);box(.25,4.7,3.8,mat(0xf5f7f9,{r:.85}),5.65,2.35,.5);box(4,4.7,.25,mat(0xf5f7f9,{r:.85}),3.55,2.35,-1.15);
  box(6.4,.7,3.4,mat(0x169fb8,{r:.38,m:.22}),0,6.25,-.1);box(6.55,.05,3.55,mat(0xffffff,{e:cyan,ei:2.2,r:.2}),0,6.58,-.1);panel(3,.68,text('tp-link',{w:1000,h:240,size:120,y:150}),1.35,6.24,1.61,0,.42);

  box(3.5,.12,.9,mat(0x0e1419,{r:.55}),-2.9,1.15,1.55);box(3.5,.06,.08,mat(0xffffff,{e:teal,ei:1.6,r:.2}),-2.9,1.08,1.1);box(.95,.58,.08,mat(0x0c1116,{r:.35}),-3.2,1.65,1.08);box(.95,.58,.08,mat(0x0c1116,{r:.35}),-2.12,1.65,1.08);panel(.84,.5,text(['TP-LINK','GAMING'],{w:780,h:460,bg:'#07151d',color:'#91f5ff',sizes:[72,88],y:165,step:105}),-3.2,1.65,1.03,0,.5);panel(.84,.5,text(['Wi-Fi','ARENA'],{w:780,h:460,bg:'#07151d',color:'#91f5ff',sizes:[72,88],y:165,step:105}),-2.12,1.65,1.03,0,.5);box(.55,.95,.25,mat(0x111820,{r:.4}),-1.35,1.53,1.55);
  const ac=mat(0xe9fbff,{t:true,o:.36,m:.1,r:.12});box(4.8,.8,2.6,mat(0xecf4f7,{r:.75,m:.1}),0,.45,1);box(4.9,.05,2.7,mat(0xffffff,{e:teal,ei:1.4,r:.2}),0,.06,1);box(3.9,.34,2.05,ac,0,.98,1);box(2.9,.31,1.48,ac,0,1.34,1);box(1.9,.28,.95,ac,0,1.65,1);router(-1.05,.92,1.15,.48);router(0,1.26,1,.48);router(1.08,.92,.84,.48);panel(2.35,.52,text(['投票 / 活動區','Vote & Win'],{w:1000,h:280,sizes:[62,56],y:105,step:88}),1.0,.58,2.31,0,.3);
  frame(2,3,2.9,2.42,2.25);frame(2.65,3,5.0,2.42,2.25);panel(1.5,.55,text(['掃描參與活動','Scan to Join'],{w:800,h:260,sizes:[60,50],y:95,step:82}),2.9,3.58,2.14,0,.28);panel(2.35,2.65,text(['WiFi Technology','',')))  Wi-Fi  )))','','CONNECTED'],{w:900,h:1100,bg:'#0b1d27',color:'#99f6ff',sizes:[66,18,88,18,62],y:145,step:180}),5.0,2.45,2.14,0,.35);panel(1.22,1.22,text(['▣ ▦ ▣','▥ ▣ ▦','▣ ▥ ▣'],{w:600,h:600,bg:'#eefaff',color:'#071119',size:90,y:155,step:150}),2.9,2.25,2.14,0,.15);
  panel(1.55,4.1,text(['tp-link','','Wi-Fi 7','Beyond Fast','','Ultra-Fast','Low Latency','More Capacity'],{w:850,h:1450,bg:'#101820',color:'#fff',align:'left',sizes:[82,20,108,52,20,46,46,46],y:120,step:145}),-5.66,2.3,1.35,Math.PI/2,.2);
  const views={overview:[[13,8,13],[0,2.7,0]],front:[[0,6,15],[0,2.4,.7]],left:[[-10.5,5.7,5.8],[-3,2,.5]],center:[[3.1,4.5,8.3],[0,1.35,1]],right:[[10.5,5.6,5.3],[4.15,2.35,1.1]]};let tw=null;function fly(k){const v=views[k];tw={t:performance.now(),sp:camera.position.clone(),st:controls.target.clone(),ep:new THREE.Vector3(...v[0]),et:new THREE.Vector3(...v[1])}}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');fly(b.dataset.view)}));const rb=document.getElementById('rotate');rb.addEventListener('click',()=>{controls.autoRotate=!controls.autoRotate;rb.classList.toggle('active',controls.autoRotate);rb.textContent=`自轉：${controls.autoRotate?'開':'關'}`});let n=false;document.getElementById('night').addEventListener('click',e=>{n=!n;scene.background.set(n?0x020609:0x061018);scene.fog.color.set(n?0x020609:0x061018);hemi.intensity=n?.35:.8;e.currentTarget.classList.toggle('active',n);e.currentTarget.textContent=n?'日間模式':'夜間模式'});
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loading.classList.add('hidden');function loop(now){requestAnimationFrame(loop);if(tw){const p=Math.min(1,(now-tw.t)/1000),e=1-Math.pow(1-p,3);camera.position.lerpVectors(tw.sp,tw.ep,e);controls.target.lerpVectors(tw.st,tw.et,e);if(p>=1)tw=null}controls.update();renderer.render(scene,camera)}loop();
